<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>取引先別ルールの確認</title><link rel="stylesheet" href="date-proposal-review.css"><main><h1>次回の取込に使える条件を確認</h1><p>合成資料による判定プレビューです。実際の本人回答の登録・保存や商品取込は行いません。</p><p>合成の確認済みルール：同じ取引先・帳票・列構造の「容量列」の単位をLと読む。容量の数値、日付、価格、在庫数は引き継ぎません。</p><label>確認する条件 <select id="scenario"><option value="same">同じ取引先・同じ形式</option><option value="supplier">別の取引先</option><option value="layout">列構造が変わった</option><option value="revoked">ルールを取消済み</option><option value="conflict">一致するルールが競合</option></select></label><button id="check">適用条件を確認</button><p id="status" role="status"></p><div id="evidence"></div><p>候補として一致しても、この画面から自動で取込は実行しません。実回答を使うルール保存・変更・取消の業務画面は未接続です。</p></main><script src="rule-preview.js"></script></html>
