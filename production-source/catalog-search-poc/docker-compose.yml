services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: catalog_search
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog-search-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_search"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  catalog-search-db:
